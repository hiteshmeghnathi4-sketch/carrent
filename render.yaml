services:
  - type: web
    name: carrent
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: carrent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
